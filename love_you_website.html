
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Do You Love Me?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ffe5ec, #ffc2d1, #ffb3c6);
    }

    .card {
      background: #ffffffee;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
      padding: 24px 24px 28px;
      max-width: 420px;
      width: 92%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .heart {
      font-size: 40px;
      animation: beat 1s infinite;
      margin-bottom: 8px;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.08); }
      50% { transform: scale(0.96); }
      75% { transform: scale(1.04); }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .buttons-area {
      position: relative;
      height: 150px;
      margin-top: 10px;
    }

    .btn {
      position: absolute;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-love {
      background: linear-gradient(135deg, #ff4b7a, #ff758f);
      color: white;
      box-shadow: 0 10px 22px rgba(255, 75, 122, 0.45);
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      padding-inline: 22px;
    }

    .btn-negative {
      background: #f3f4f6;
      color: #111827;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #111827;
      color: #f9fafb;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 900;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .popup {
      background: white;
      border-radius: 18px;
      padding: 22px 20px 18px;
      text-align: center;
      max-width: 280px;
      width: 90%;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    .popup .big-heart {
      font-size: 44px;
      margin-bottom: 8px;
    }

    .popup h2 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .popup p {
      font-size: 14px;
      margin-bottom: 14px;
      color: #374151;
    }

    .popup button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      background: linear-gradient(135deg, #ff4b7a, #ff758f);
      color: white;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      h1 { font-size: 20px; }
      .buttons-area { height: 170px; }
      .btn { font-size: 13px; padding: 9px 14px; }
      .btn-love { top: 10px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Do you love me?</h1>
    <p class="subtitle">Only one honest answer allowed 😏</p>

    <div class="buttons-area" id="buttonsArea">
      <button class="btn btn-love" id="btnLove">I love you ❤️</button>

      <button class="btn btn-negative" id="btnDontLike">I don't like you</button>
      <button class="btn btn-negative" id="btnNo">No</button>
      <button class="btn btn-negative" id="btnHate">I hate you</button>
    </div>
  </div>

  <div class="toast" id="toast">Nice try 😆 You can only choose love!</div>

  <div class="overlay" id="overlay">
    <div class="popup">
      <div class="big-heart">💖</div>
      <h2>Yay! I love you too!</h2>
      <p>You officially made my day 100x better 🥰</p>
      <button id="popupClose">Aww 🫶</button>
    </div>
  </div>

  <script>
    const area = document.getElementById("buttonsArea");
    const negatives = [
      document.getElementById("btnDontLike"),
      document.getElementById("btnNo"),
      document.getElementById("btnHate"),
    ];
    const loveBtn = document.getElementById("btnLove");
    const toast = document.getElementById("toast");
    const overlay = document.getElementById("overlay");
    const popupClose = document.getElementById("popupClose");

    function randomPosition(btn) {
      const rect = area.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();

      const padding = 10;
      const maxX = rect.width - btnRect.width - padding;
      const maxY = rect.height - btnRect.height - padding;

      const x = padding + Math.random() * maxX;
      const y = padding + 40 + Math.random() * (maxY - 40);

      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }

    negatives.forEach((btn, index) => {
      const areaRect = area.getBoundingClientRect();
      const baseY = areaRect.height - 60;
      const spacing = areaRect.width / (negatives.length + 1);
      btn.style.top = baseY + "px";
      btn.style.left = spacing * (index + 1) - 50 + "px";
    });

    function showToast() {
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function attachRunAway(btn) {
      ["mouseenter", "mouseover", "pointerover", "touchstart"].forEach(evt => {
        btn.addEventListener(evt, (e) => {
          e.preventDefault();
          randomPosition(btn);
          showToast();
        }, { passive: false });
      });

      btn.addEventListener("click", (e) => {
        e.preventDefault();
        randomPosition(btn);
        showToast();
      });
    }

    negatives.forEach(attachRunAway);

    loveBtn.addEventListener("click", () => {
      overlay.classList.add("show");
    });

    popupClose.addEventListener("click", () => {
      overlay.classList.remove("show");
    });

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        overlay.classList.remove("show");
      }
    });
  </script>
</body>
</html>
